[project]
name = "jimmy"
version = "0.1.0"
description = "Jimmy Code - a terminal-native coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.75.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "typer>=0.16.0",
    "textual>=8.2.8",
]

[project.scripts]
jimmy = "jimmy.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jimmy", "src/tui"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
